name: Update completed Kobo feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/scrape-kobo-sale.mjs'
      - 'scripts/build-completed-feeds.mjs'
      - 'scripts/build-all-sale-feed.mjs'
      - 'scripts/finalize-popular-feeds.mjs'
      - '.github/workflows/update-kobo-sale.yml'

permissions:
  contents: write

concurrency:
  group: completed-kobo-feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out app code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose Kobo result card structure
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const url='https://books.rakuten.co.jp/search?g=101&merch=53626&h=100&v=1&s=8&maxp=199';
          const response=await fetch(url,{headers:{Accept:'text/html,application/xhtml+xml','Accept-Language':'ja-JP,ja;q=0.9,en;q=0.5','User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'}});
          const html=await response.text();
          const $=cheerio.load(html);
          const candidates=$('a[href*="/rk/"]').toArray().filter(element=>$(element).text().trim().length>5);
          const element=candidates[0];
          if(!element)throw new Error('NO_DIAGNOSTIC_PRODUCT_ANCHOR');
          const card=$(element).closest('li.rbcomp__item-tile__item');
          if(!card.length)throw new Error('NO_DIAGNOSTIC_PRODUCT_CARD');
          console.log('[CARD_DIAG_ANCHOR]',JSON.stringify({title:$(element).text().trim(),href:$(element).attr('href')||''}));
          console.log('[CARD_DIAG_CARD_TEXT]',JSON.stringify({text:card.text().replace(/\s+/g,' ').trim()}));
          console.log('[CARD_DIAG_CARD_HTML]',String(card.html()||'').slice(0,16000));
          card.find('*').each((index,node)=>{
            const el=$(node),attrs=node.attribs||{};
            const interestingAttrs=Object.fromEntries(Object.entries(attrs).filter(([key,value])=>/^(?:data-|item|isbn|jan|id$|class$|href$)/i.test(key)||/(?:isbn|item|jan|product|author|campaign)/i.test(String(value))));
            const className=String(attrs.class||'');
            if(Object.keys(interestingAttrs).length||/(?:author|writer|campaign|price|item|product)/i.test(className)){
              console.log('[CARD_DIAG_ELEMENT]',JSON.stringify({index,tag:String(node.name||''),attrs:interestingAttrs,text:el.clone().children().remove().end().text().replace(/\s+/g,' ').trim().slice(0,240)}));
            }
          });
          NODE

      - name: Collect every current Rakuten Kobo sale using price-bucket paging
        run: node scripts/scrape-kobo-sale.mjs /tmp/kobo-sale-candidates.json

      - name: Build base completed Kobo feeds
        env:
          KOBO_API_BASE: https://rakuten-kobo.vercel.app
        run: node scripts/build-completed-feeds.mjs /tmp/kobo-sale-candidates.json /tmp/completed-feeds

      - name: Build exhaustive static sale pages
        run: node scripts/build-all-sale-feed.mjs /tmp/kobo-sale-candidates.json /tmp/completed-feeds/kobo-sale.json /tmp/completed-feeds/sale

      - name: Validate static sale metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const index=JSON.parse(await readFile('/tmp/completed-feeds/sale/index.json','utf8'));
          const page=JSON.parse(await readFile('/tmp/completed-feeds/sale/pages/0001.json','utf8'));
          if(!index.completed||!index.pageCount||!Array.isArray(page.items)||!page.items.length)throw new Error('STATIC_SALE_FEED_EMPTY');
          const authors=page.items.filter(item=>String(item.author||'').trim()).length;
          const ends=page.items.filter(item=>String(item.saleEndAt||'').trim()).length;
          console.log(`Static sale metadata page1: authors=${authors}/${page.items.length}, endDates=${ends}/${page.items.length}`);
          if(authors/page.items.length<0.80)throw new Error(`STATIC_SALE_AUTHOR_RATE_LOW_${authors}_OF_${page.items.length}`);
          NODE

      - name: Expand popular rankings without dropping resolved books
        continue-on-error: true
        env:
          KOBO_API_BASE: https://rakuten-kobo.vercel.app
        run: node scripts/finalize-popular-feeds.mjs /tmp/completed-feeds

      - name: Publish completed feeds to ranking-data branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ranking-data
          git switch -C ranking-data origin/ranking-data
          mkdir -p data
          cp /tmp/completed-feeds/kobo-sale.json data/kobo-sale.json
          cp /tmp/completed-feeds/popular-week.json data/popular-week.json
          cp /tmp/completed-feeds/popular-month.json data/popular-month.json
          cp /tmp/completed-feeds/popular-year.json data/popular-year.json
          rm -rf data/sale
          mkdir -p data/sale
          cp -R /tmp/completed-feeds/sale/. data/sale/
          git add data/kobo-sale.json data/popular-week.json data/popular-month.json data/popular-year.json data/sale
          if git diff --cached --quiet; then
            echo "Completed Kobo feeds are unchanged."
            exit 0
          fi
          git commit -m "data: update completed Kobo feeds"
          git push origin HEAD:ranking-data
